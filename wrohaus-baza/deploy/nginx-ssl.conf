# IP — samo HTTP
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 10m;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    include /var/www/sofelio/deploy/nginx-apple-pay.inc;

    location ^~ /data/ {
        return 404;
    }

    # Apple Pay / PayU: nie DENY — ramkę ogranicza CSP w aplikacji.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    include /var/www/sofelio/deploy/nginx-app.inc;
}

server {
    listen 80;
    listen [::]:80;
    server_name wrohaus.pl www.wrohaus.pl wrohaus.com www.wrohaus.com sofelio.pl www.sofelio.pl;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # PayU/Apple nie idą za 308 HTTP→HTTPS — plik musi wrócić 200 już tu.
    include /var/www/sofelio/deploy/nginx-apple-pay.inc;

    location / {
        return 308 https://wrohaus.pl$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.wrohaus.pl;

    ssl_certificate /etc/letsencrypt/live/wrohaus.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wrohaus.pl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /var/www/sofelio/deploy/nginx-apple-pay.inc;

    location / {
        return 308 https://wrohaus.pl$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wrohaus.pl;

    ssl_certificate /etc/letsencrypt/live/wrohaus.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wrohaus.pl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    location ^~ /data/ {
        return 404;
    }

    include /var/www/sofelio/deploy/nginx-apple-pay.inc;

    # Apple Pay / PayU: nie DENY — ramkę ogranicza CSP w aplikacji.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /var/www/sofelio/deploy/nginx-app.inc;
}

include /etc/nginx/snippets/legacy-wrohaus-com-ssl.conf;
include /etc/nginx/snippets/legacy-sofelio-ssl.conf;
